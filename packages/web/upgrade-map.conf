# Maps the Upgrade request header to the Connection header value the proxy
# should send upstream: "upgrade" when a WebSocket handshake is in progress,
# otherwise "close". Required by the /api WS proxy in default.conf. Lives at the
# http{} context (the nginx image includes conf.d/*.conf inside http).
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}
