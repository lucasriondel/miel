# The public site: three static HTML files and nothing else.
#
# This container is sent only the paths the reverse proxy does not give to the
# app — the site root. /app/* and /api/* go to the web container (see DEPLOY.md
# and src/deploy/topology.ts), so nothing here proxies, rewrites, or gates.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # The pages are full of em dashes and arrows. They declare their own charset in
  # a <meta> inside the first 1024 bytes, so this is belt-and-braces — but nginx
  # ships with `charset off`, and a Content-Type header beats a meta tag.
  charset utf-8;

  # nginx adds the trailing slash on a directory with a redirect built from its
  # own idea of the scheme and port. Behind the Cloudflare tunnel that would
  # point at http://, which Traefik answers with a 308 back to https -> a loop.
  # A relative Location keeps whatever scheme the browser is already on.
  absolute_redirect off;

  # The pages change only on deploy, and a stale privacy policy in a browser
  # cache is worse than a revalidation. No far-future expiry here: there are no
  # hashed filenames to hang one on, since the pages inline everything.
  location / {
    # $uri/ is what makes the extensionless links work: /privacy is emitted as
    # privacy/index.html. Anything else 404s rather than being answered with the
    # homepage — a single-page fallback would hide a routing mistake by serving
    # landing HTML for an app URL.
    try_files $uri $uri/ =404;
    add_header Cache-Control "public, max-age=0, must-revalidate";
  }
}
